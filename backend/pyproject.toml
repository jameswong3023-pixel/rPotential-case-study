[project]
name = "uop-library-backend"
version = "0.1.0"
description = "UoP Library case study backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "sqlmodel>=0.0.16",
    "uvicorn[standard]>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
